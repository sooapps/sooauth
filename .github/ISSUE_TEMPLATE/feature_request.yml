name: "✨ Feature or SDK Proposal"
description: "Suggest an idea, new SDK, framework adapter, or architectural improvement"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make Sooauth better! Let us know what feature or SDK you would like to see.
  - type: textarea
    id: problem
    attributes:
      label: "Problem statement"
      description: "What pain point or use case does this feature solve?"
      placeholder: "When integrating Sooauth with SvelteKit / FastAPI, we currently have to write custom OIDC wrappers..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed solution"
      description: "Describe the solution or API you'd like to see implemented."
      placeholder: "A first-party @sooauth/sdk-vue package or Python client..."
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: "Category"
      options:
        - "SDK & Client Libraries (Vue, Svelte, Python, Go, etc.)"
        - "Core OIDC & Identity Features"
        - "Admin Dashboard & UI"
        - "Self-Hosting & DevOps"
        - "Documentation & Examples"
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: "Would you like to help implement this?"
      options:
        - label: "Yes, I am interested in opening a Pull Request for this feature."
