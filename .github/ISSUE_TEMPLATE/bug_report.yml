name: "🐛 Bug Report"
description: "Report an issue or unexpected behavior in Sooauth"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "When calling /oauth/token with PKCE..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Steps to reproduce"
      description: "How can we reproduce this behavior?"
      placeholder: |
        1. Start Sooauth via docker compose up -d
        2. Send POST request to ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: "Deployment environment"
      options:
        - "Self-hosted Docker Compose"
        - "Self-hosted Coolify"
        - "Managed Cloud (auth.sooauth.com)"
        - "Local Go binary"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs or error messages"
      description: "Please copy any relevant server logs or browser console errors."
      render: shell
