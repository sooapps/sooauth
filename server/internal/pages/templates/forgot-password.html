{{define "forgot-password-content"}}
<section class="card">
  <h1>Reset password</h1>
  <p class="card-sub">Enter your email and we'll send you instructions to reset your password.</p>
  {{if .Message}}<p class="message">{{.Message}}</p>{{end}}
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <form id="forgot-form" class="stack" data-client-id="{{.ClientID}}" data-return-to="{{.ReturnTo}}">
    <label>Email<input name="email" type="email" autocomplete="username" required /></label>
    <button type="submit">Send instructions</button>
  </form>
  <div class="links">
    <a href="/auth/sign-in{{if .ClientID}}?client_id={{.ClientID}}{{if .ReturnTo}}&amp;return_to={{.ReturnTo}}{{end}}{{else if .ReturnTo}}?return_to={{.ReturnTo}}{{end}}">Back to sign in</a>
  </div>
</section>
{{end}}
