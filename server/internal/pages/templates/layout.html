{{define "layout"}}
<!doctype html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.Title}} · {{.BrandName}}</title>
  <link rel="icon" href="/auth/static/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/auth/static/icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/auth/static/icon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/auth/static/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
  <script>
    (function() {
      try {
        var saved = localStorage.getItem("sooauth_theme");
        var theme = saved;
        if (!theme || theme === "system") {
          var m = window.location.search.match(/[?&]theme=(dark|light)/);
          if (m) {
            theme = m[1];
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          } else {
            theme = "light";
          }
        }
        document.documentElement.setAttribute("data-theme", theme);
      } catch(e) {}
    })();
  </script>
  <script>window.__I18N__ = {{.ClientJSON}};</script>
  <style>
    :root { --tenant-accent: {{.AccentColor}}; }
  </style>
  <link rel="stylesheet" href="/auth/static/style.css?v=9" />
</head>
<body>
  <div class="auth-shell">
    {{.Body}}
    {{if not .HideFooter}}<footer class="auth-foot">
      <div class="foot-links">
        <a href="/dashboard/">{{index .T "layout.dashboard"}}</a>
        <span aria-hidden="true">·</span>
        <a href="https://sooauth.com/docs">{{index .T "layout.docs"}}</a>
        <span aria-hidden="true">·</span>
        <a href="https://sooauth.com/docs/integrate-oidc#ai-prompt">{{index .T "layout.ai_prompt"}}</a>
        <span aria-hidden="true">·</span>
        <a href="https://sooapps.com" target="_blank" rel="noopener">{{index .T "layout.sooapps"}}</a>
      </div>
      <button type="button" class="theme-toggle-btn" id="theme-toggle" aria-label="{{index .T "layout.theme_toggle"}}" title="{{index .T "layout.theme_toggle"}}">
        <svg class="theme-icon icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="theme-icon icon-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </footer>{{end}}
  </div>
  <script src="/auth/static/app.js?v=10"></script>
</body>
</html>
{{end}}
