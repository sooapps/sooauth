<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · sooauth</title>
  <link rel="icon" href="/dashboard/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/dashboard/icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/dashboard/icon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/dashboard/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FFFFFF;
      --surface: #F5F5F5;
      --surface-2: #FFFFFF;
      --border: #C4C4C4;
      --text: #051B23;
      --muted: #5D6B70;
      --accent: #E8FF3F;
      --accent-soft: rgba(232, 255, 63, 0.35);
      --success: #051B23;
      --warn: #051B23;
      --danger: #051B23;
      --sidebar-w: 240px;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0E0F11;
      --surface: #1C1D1F;
      --surface-2: #29292B;
      --border: #353537;
      --text: #F5F6F6;
      --muted: #9D9E9F;
      --accent-soft: rgba(232, 255, 63, 0.14);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #FFFFFF;
      --surface: #F5F5F5;
      --surface-2: #FFFFFF;
      --border: #C4C4C4;
      --text: #051B23;
      --muted: #5D6B70;
      --accent-soft: rgba(232, 255, 63, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
       width: var(--sidebar-w);
       flex: 0 0 var(--sidebar-w);
       background: var(--surface);
      border-right: 1px solid var(--border);
       padding: 24px 16px 18px;
      display: flex;
      flex-direction: column;
       gap: 18px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand {
       display: flex;
       align-items: center;
       gap: 8px;
      font-family: Syne, sans-serif;
      font-weight: 700;
       font-size: 1.35rem;
      letter-spacing: -0.03em;
      color: var(--text);
      text-decoration: none;
       padding: 0 10px;
    }
     .brand img { width: 32px; height: 32px; object-fit: contain; }
    .brand small { display: block; font-size: 0.72rem; color: var(--muted); font-weight: 600; margin-top: 2px; }
    .nav { display: grid; gap: 3px; }
    .sidebar-project { display: grid; gap: 10px; padding: 0 10px 18px; border-bottom: 1px solid var(--border); }
    .sidebar-project .select, .sidebar-project .btn { width: 100%; min-width: 0; }
    .nav-label { padding: 0 10px 5px; color: var(--muted); font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
    .nav button {
      text-align: left;
      background: transparent;
      border: none;
      color: var(--muted);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
       padding: 10px 12px;
       border-radius: 7px;
    }
    .nav button:hover { background: var(--surface-2); color: var(--text); }
    .nav button.active { background: var(--accent); color: #051B23; font-weight: 600; }
    .sidebar-links { display: grid; gap: 7px; padding-top: 2px; border-top: 1px solid var(--border); }
    .sidebar-foot { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--muted); }
    .sidebar-foot .email { color: var(--text); font-weight: 500; margin-bottom: 8px; word-break: break-all; }
    .sidebar-docs {
      display: block;
       margin: 0;
       padding: 9px 10px;
       border-radius: 7px;
       border: 1px solid transparent;
      background: var(--surface-2);
      color: var(--text);
      text-decoration: none;
       font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
    }
    .sidebar-docs:hover { border-color: var(--accent); background: var(--accent-soft); }
    .main { flex: 1; min-width: 0; width: 0; max-width: 1440px; padding: 34px clamp(20px, 4vw, 64px) 64px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
       margin-bottom: 32px;
    }
    .topbar h1 { margin: 0; font-family: Syne, sans-serif; font-size: clamp(1.45rem, 2.2vw, 2rem); font-weight: 700; letter-spacing: -0.04em; }
    .topbar-title { min-width: 0; }
    .project-pill {
      margin: 4px 0 0;
      font-size: 0.8125rem;
      color: var(--muted);
    }
    .project-pill strong { color: var(--text); font-weight: 600; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .select, .btn {
      font: inherit;
      font-size: 0.875rem;
       border-radius: 0;
      padding: 9px 14px;
    }
    .select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      min-width: 180px;
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      font-weight: 500;
    }
    .btn:hover { border-color: var(--muted); }
    .btn-primary { background: var(--accent); border-color: #051B23; color: #051B23; font-weight: 600; }
    .btn-primary:hover { filter: brightness(1.06); color: #051B23; }
    .btn-ghost { background: transparent; }
    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 0;
      background: var(--accent-soft);
      color: var(--text);
      border: 1px solid var(--text);
    }
    .panel { display: none; animation: fade .2s ease; }
    .panel.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
       border-radius: 10px;
       padding: clamp(18px, 2.5vw, 28px);
       margin-bottom: 18px;
       overflow: hidden;
    }
    .card h2 { margin: 0 0 6px; font-size: 1.05rem; }
    .card p.desc { margin: 0 0 18px; color: var(--muted); font-size: 0.875rem; line-height: 1.5; }
    .grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .integration-fields { display: grid; gap: 16px; }
    .integration-fields .field-client { max-width: 420px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
    .copy-row { display: flex; gap: 8px; align-items: stretch; min-width: 0; }
    .copy-row input, .copy-row .value {
      flex: 1;
      min-width: 0;
      background: var(--surface-2);
      border: 1px solid var(--border);
       border-radius: 0;
      padding: 10px 12px;
      color: var(--text);
      font: inherit;
      font-size: 0.875rem;
    }
    .copy-row .value {
      overflow-x: auto;
      white-space: nowrap;
      word-break: normal;
      font-family: ui-monospace, monospace;
      font-size: 0.8125rem;
      scrollbar-width: thin;
    }
    input[type=text], input[type=url], input[type=password], input:not([type]) {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
       border-radius: 0;
      padding: 10px 12px;
      color: var(--text);
      font: inherit;
      font-size: 0.875rem;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    input:disabled { opacity: .55; }
    .uri-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .uri-row input { margin: 0; }
    .btn-icon {
      width: 42px; height: 42px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.2rem; flex-shrink: 0;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: .04em; }
    .empty { color: var(--muted); text-align: center; padding: 32px 16px; }
    .alert {
      padding: 12px 14px; border-radius: 0; margin-bottom: 16px; font-size: 0.875rem;
      background: var(--surface); border: 1px solid var(--text); color: var(--text);
    }
    .notice {
       padding: 12px 14px; border-radius: 0; margin-bottom: 16px; font-size: 0.875rem;
       background: var(--accent-soft); border: 1px solid var(--text); color: var(--text);
    }
    .provider-list { display: grid; gap: 12px; }
    .provider-item {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 18px 20px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
    }
    .provider-item .info h3 { margin: 0 0 4px; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
    .provider-item .info p { margin: 0; font-size: 0.8125rem; color: var(--muted); line-height: 1.45; }
    .provider-custom {
       margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
      display: grid; gap: 10px; max-width: 520px;
    }
    .provider-custom .mode-row { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.8125rem; }
    .provider-custom label.mode { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text); }
    .provider-custom .callback { font-size: 0.8125rem; color: var(--muted); }
    .provider-custom .callback-label { margin: 0 0 6px; font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .field-hint { margin: 6px 0 0; font-size: 0.78rem; color: var(--muted); line-height: 1.4; }
    .secret-saved {
      display: inline-block;
      margin-left: 8px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--success);
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(127,212,168,.12);
      vertical-align: middle;
    }
    input.secret-masked { letter-spacing: 0.12em; font-family: ui-monospace, monospace; }
    .provider-custom .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .provider-item-wrap { display: grid; gap: 0; }
     .provider-item-wrap > .provider-item { border-radius: 10px; }
    .provider-item-wrap > .provider-custom-panel {
        display: none; padding: 0 20px 18px; background: var(--surface-2); border: 1px solid var(--border);
        border-top: none; border-radius: 0 0 10px 10px;
     }
     .provider-item-wrap.is-open > .provider-item { border-radius: 10px 10px 0 0; border-bottom-color: transparent; }
     .provider-item-wrap.is-open > .provider-custom-panel { display: block; }
    .status-dot { font-size: 0.72rem; font-weight: 600; padding: 3px 8px; border-radius: 0; }
    .status-dot.on { background: rgba(127,212,168,.15); color: var(--success); }
    .status-dot.off { background: rgba(148,144,168,.15); color: var(--muted); }
    .status-dot.soon { background: rgba(245,194,107,.12); color: var(--warn); }
    .switch { position: relative; width: 48px; height: 28px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span {
       position: absolute; inset: 0; background: #353537; border-radius: 0; cursor: pointer; transition: .2s;
    }
    .switch span:before {
       content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 0; transition: .2s;
    }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span:before { transform: translateX(20px); }
    .switch input:disabled + span { opacity: .45; cursor: not-allowed; }
    .plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .plan-card {
      border: 1px solid var(--border);
       border-radius: 0;
      padding: 20px;
      background: var(--surface-2);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .plan-card.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft); }
    .plan-card h3 { margin: 0; font-size: 1.05rem; }
    .plan-price { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; }
    .plan-price small { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
    .plan-features { margin: 0; padding-left: 18px; color: var(--muted); font-size: 0.875rem; display: grid; gap: 6px; }
    .plan-actions { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .metric-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 16px; }
     .metric { background: var(--surface); border: 1px solid var(--border); border-radius: 0; padding: 16px; }
    .metric strong { display: block; font-size: 1.6rem; letter-spacing: -0.03em; }
    .metric span { color: var(--muted); font-size: 0.78rem; }
    .webhook-list { display: grid; gap: 12px; }
     .webhook-item { background: var(--surface-2); border: 1px solid var(--border); border-radius: 0; padding: 16px; }
    .webhook-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .webhook-url { font-family: ui-monospace, monospace; font-size: 0.8125rem; word-break: break-all; }
    .webhook-events { color: var(--muted); font-size: 0.8rem; margin: 8px 0 14px; }
    .webhook-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .event-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin: 8px 0 16px; }
    .event-grid label { color: var(--muted); font-size: 0.8125rem; display: flex; gap: 7px; align-items: center; }
    @media (max-width: 860px) {
      .app { flex-direction: column; }
       .sidebar { width: 100%; flex-basis: auto; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--border); }
       .nav { grid-template-columns: repeat(2, 1fr); }
       .sidebar-links { grid-template-columns: repeat(2, 1fr); }
       .main { padding: 20px 16px 40px; }
     }
     @media (max-width: 520px) {
       .topbar-actions { width: 100%; }
       .topbar-actions > * { flex: 1; min-width: 0; }
       .select { min-width: 0; width: 100%; }
       .copy-row { flex-wrap: wrap; }
       .copy-row .btn { width: 100%; }
       .provider-item { align-items: flex-start; }
       .provider-item .info { min-width: 0; }
       table { display: block; overflow-x: auto; white-space: nowrap; }
     }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
       <a class="brand" href="https://sooauth.com"><img src="/dashboard/sooauth-light.png" alt="sooauth" /><span>sooauth<small>dashboard</small></span></a>
       <div class="sidebar-project">
         <select class="select" id="project-select" hidden></select>
         <button type="button" class="btn btn-primary" id="add-project" hidden>+ New project</button>
       </div>
       <nav class="nav" id="nav">
         <div class="nav-label">Workspace</div>
        <button type="button" class="active" data-tab="integration">Integration</button>
        <button type="button" data-tab="overview">Overview</button>
        <button type="button" data-tab="providers">Social login</button>
        <button type="button" data-tab="project">Project</button>
        <button type="button" data-tab="users">Users</button>
        <button type="button" data-tab="sessions">Sessions</button>
        <button type="button" data-tab="theme">Theme</button>
        <button type="button" data-tab="billing">Billing</button>
        <button type="button" data-tab="audit">Audit</button>
         <button type="button" data-tab="webhooks">Webhooks</button>
       </nav>
       <div class="sidebar-links" aria-label="Resources">
         <div class="nav-label">Resources</div>
         <a class="sidebar-docs" href="https://sooauth.com/docs" target="_blank" rel="noopener">Documentation <span aria-hidden="true">↗</span></a>
         <a class="sidebar-docs" href="https://sooauth.com/docs/integrate-oidc#ai-prompt" target="_blank" rel="noopener">AI setup prompt <span aria-hidden="true">↗</span></a>
         <a class="sidebar-docs" href="/auth/account">Security Center <span aria-hidden="true">↗</span></a>
         <button type="button" class="sidebar-docs" id="theme-toggle">Use dark theme</button>
       </div>
      <div class="sidebar-foot">
        <div class="email" id="dash-user"></div>
        <button type="button" class="btn btn-ghost" id="sign-out" style="width:100%">Sign out</button>
      </div>
    </aside>
    <main class="main">
      <div id="global-alert" hidden></div>
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">Integration</h1>
          <p class="project-pill" id="project-pill" hidden>Editing <strong id="project-pill-name"></strong></p>
        </div>
         <div class="topbar-actions">
           <span class="badge" id="plan-badge" hidden></span>
        </div>
      </header>

      <section class="panel active" id="panel-integration"></section>
      <section class="panel" id="panel-overview"></section>
      <section class="panel" id="panel-providers"></section>
      <section class="panel" id="panel-project"></section>
      <section class="panel" id="panel-users"></section>
      <section class="panel" id="panel-sessions"></section>
      <section class="panel" id="panel-theme"></section>
      <section class="panel" id="panel-billing"></section>
      <section class="panel" id="panel-audit"></section>
      <section class="panel" id="panel-webhooks"></section>
    </main>
  </div>
  <script>
    const titles = {
      integration: "Integration",
      overview: "Overview",
      providers: "Social login",
      project: "Project settings",
      users: "App users",
      sessions: "Sessions",
      theme: "Theme",
      billing: "Billing",
      audit: "Audit log",
      webhooks: "Webhooks",
    };
    const providerLabels = { google: "Google", github: "GitHub", facebook: "Facebook", x: "X" };
    const SECRET_MASK = "****************";
    let dashMe = null;
    let activeTab = "integration";

    function csrfToken() {
      const m = document.cookie.match(/(?:^|; )sooauth_csrf=([^;]+)/);
      return m ? decodeURIComponent(m[1]) : "";
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    function embedSnippet(data) {
      const issuer = (data.issuer || "").replace(/\/$/, "");
      return `<div id="sooauth-widget"></div>\n<script src="${issuer}/v1/widget/embed.js" data-client-id="${data.client_id}" data-mode="signin" async><\/script>`;
    }
    function formatWhen(iso) {
      if (!iso) return "—";
      try {
        return new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
      } catch { return iso; }
    }
    function showAlert(msg) {
      const el = document.getElementById("global-alert");
      el.hidden = false; el.className = "alert"; el.textContent = msg;
    }
    function showNotice(msg) {
      const el = document.getElementById("global-alert");
      el.hidden = false; el.className = "notice"; el.textContent = msg;
      setTimeout(() => { el.hidden = true; }, 3500);
    }
    async function api(path, opts = {}) {
      const res = await fetch("/dashboard/api" + path, { credentials: "same-origin", ...opts });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) { location.href = "/auth/sign-in?return_to=/dashboard/"; return null; }
      if (!res.ok) throw new Error(data.message || data.error || "request_failed");
      return data;
    }
    function showTab(name, updateHash = true) {
      if (!titles[name]) name = "integration";
      activeTab = name;
      document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + name));
      document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
      updatePageTitle();
      if (updateHash) {
        const next = name === "integration" ? "#integration" : "#" + name;
        if (location.hash !== next) history.replaceState(null, "", "/dashboard/" + next);
      }
    }
    function updatePageTitle() {
      const base = titles[activeTab] || activeTab;
      const project = dashMe?.project?.name;
      document.getElementById("page-title").textContent = project ? `${base} · ${project}` : base;
    }
    function updateProjectPill(me) {
      const pill = document.getElementById("project-pill");
      const nameEl = document.getElementById("project-pill-name");
      if (!pill || !nameEl || !me?.project?.name) {
        if (pill) pill.hidden = true;
        return;
      }
      nameEl.textContent = me.project.name;
      pill.hidden = false;
    }
    function tabFromHash() {
      const raw = (location.hash || "#integration").replace(/^#/, "");
      return titles[raw] ? raw : "integration";
    }
    window.addEventListener("hashchange", () => showTab(tabFromHash(), false));
    document.querySelectorAll("#nav button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
    document.getElementById("sign-out").onclick = async () => {
      const btn = document.getElementById("sign-out");
      btn.disabled = true;
      try {
        const res = await fetch("/auth/sign-out", { method: "POST", credentials: "same-origin", headers: { "X-CSRF-Token": csrfToken() } });
        if (!res.ok) throw new Error("sign_out_failed");
        location.href = "/auth/sign-in";
      } catch (e) {
        btn.disabled = false;
        showAlert("Sign out failed. Refresh and try again.");
      }
    };

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => showNotice("Copied to clipboard.")).catch(() => showAlert("Could not copy."));
    }

    function renderUriRows(container, uris) {
      const list = uris.length ? uris : [""];
      container.innerHTML = list.map((uri, i) => `
        <div class="uri-row">
          <input type="url" name="redirect_uri" value="${escapeHtml(uri)}" placeholder="https://yourapp.com/api/auth/callback/oidc or /login" />
          ${i === list.length - 1

    async function setupHeader(me) {
      if (me?.email) document.getElementById("dash-user").textContent = me.email;
      if (!me?.projects?.length) return;
      const sel = document.getElementById("project-select");
      const add = document.getElementById("add-project");
      const badge = document.getElementById("plan-badge");
      sel.hidden = false; badge.hidden = false;
      badge.textContent = me.account?.plan_label || "Free";
      badge.style.cursor = "pointer";
      badge.title = "View billing";
      badge.onclick = () => showTab("billing");
      sel.innerHTML = me.projects.map(p => `<option value="${p.id}" ${p.id === me.project?.id ? "selected" : ""}>${escapeHtml(p.name)}</option>`).join("");
      const canAdd = (me.account?.project_count || 0) < (me.account?.max_projects || 1);
      add.hidden = !canAdd;
      sel.onchange = async () => {
        const prev = me.project?.id;
        const nextName = sel.options[sel.selectedIndex]?.text || "project";
        sel.disabled = true;
        try {
          await api("/projects/" + sel.value + "/select", { method: "POST" });
          showNotice("Switched to " + nextName + " — refreshing…");
          await refreshDashboard();
          showTab(activeTab, false);
        } catch (e) {
          if (prev) sel.value = prev;
          showAlert(e.message);
        } finally {
          sel.disabled = false;
        }
      };
      add.onclick = async () => {
        const name = prompt("Project name:");
        if (name === null) return;
        try {
          await api("/projects", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });

        } catch (e) { showAlert(e.message); }

            </label>
            <label style="display:flex;align-items:center;gap:10px;margin:12px 0;font-size:.875rem;color:var(--muted)">
              <input name="password_require_number" type="checkbox" ${data.password_require_number ? "checked" : ""} style="width:auto">
              Require number
            </label>
            <label style="display:flex;align-items:center;gap:10px;margin:12px 0;font-size:.875rem;color:var(--muted)">
              <input name="password_require_special" type="checkbox" ${data.password_require_special ? "checked" : ""} style="width:auto">
              Require special character
            </label>
            <p class="desc">Current rule: ${escapeHtml(data.password_hint || "at least 8 characters")}</p>
            <button type="submit" class="btn btn-primary">Save</button>
          </form></div>`;
        document.getElementById("project-form").onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          await api("/project", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
            name: fd.get("name"),
            email_verify_required: fd.get("email_verify_required") === "on",
            email_verify_delivery: fd.get("email_verify_delivery") || "link",
            password_min_length: Number(fd.get("password_min_length") || 8),
            password_require_upper: fd.get("password_require_upper") === "on",
            password_require_number: fd.get("password_require_number") === "on",
            password_require_special: fd.get("password_require_special") === "on",
          })});
          showNotice("Project settings saved.");
          loadProject();
        };
      } catch (err) { el.innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`; }
    }

    async function loadUsers() {
      const el = document.getElementById("panel-users");
      try {
        const data = await api("/users");
        if (!data?.users?.length) {
           el.innerHTML = `<div class="card"><div class="empty">No app users yet. App users are the end users of your product, not dashboard accounts. Create a separate test account in your app to verify signup and email verification.</div></div>`;
          return;
        }
        el.innerHTML = `<div class="card"><h2>${data.users.length} app users</h2>
           <p class="desc">App users are end users who signed up through your product, not dashboard logins. For a test-account verification workflow, use a different email in your app, open the verification link or enter its 6-digit code, then refresh this list. Disabling blocks sign-in without deleting the account; Remove keeps its existing destructive behavior.</p>
           <table><thead><tr><th>Email</th><th>Signed up with</th><th>Email verified</th><th>Status</th><th>Joined</th><th></th></tr></thead><tbody>${
           data.users.map(u => `<tr>
             <td>${escapeHtml(u.email)}</td>
             <td>${escapeHtml(u.signup_method || "—")}</td>
             <td>${u.email_verified ? "Yes" : "No"}</td>
             <td>${u.disabled ? "Disabled" : "Active"}</td>
             <td>${escapeHtml(formatWhen(u.created_at))}</td>
             <td><div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">
               ${!u.email_verified ? `<button class="btn" type="button" data-resend-user="${escapeHtml(u.id)}">Resend verification</button>` : ""}
               <button class="btn" type="button" data-toggle-user="${escapeHtml(u.id)}" data-disabled="${u.disabled ? "1" : "0"}">${u.disabled ? "Enable" : "Disable"}</button>
               <button class="btn" type="button" data-remove-user="${escapeHtml(u.id)}" data-email="${escapeHtml(u.email)}">Remove</button>
             </div></td>
           </tr>`).join("")
         }</tbody></table></div>`;
         el.querySelectorAll("[data-resend-user]").forEach(btn => btn.onclick = async () => {
           btn.disabled = true;
           try { await api("/users/" + btn.dataset.resendUser + "/resend-verification", { method: "POST" }); showNotice("Verification email sent."); }
           catch (err) { showAlert(err.message); }
           finally { btn.disabled = false; }
         });
         el.querySelectorAll("[data-toggle-user]").forEach(btn => btn.onclick = async () => {
           const disabled = btn.dataset.disabled === "1";
           try { await api("/users/" + btn.dataset.toggleUser + (disabled ? "/enable" : "/disable"), { method: "POST" }); showNotice(disabled ? "User enabled." : "User disabled."); loadUsers(); }
           catch (err) { showAlert(err.message); }
         });
        el.querySelectorAll("[data-remove-user]").forEach(btn => btn.onclick = async () => {
          const email = btn.dataset.email || "this user";
          if (!confirm(`Remove ${email} from this project?`)) return;
          await api("/users/" + btn.dataset.removeUser, { method: "DELETE" });
          showNotice("User removed.");
          loadUsers();
        });
      } catch (err) { el.innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`; }
    }

    async function loadSessions() {
      const el = document.getElementById("panel-sessions");
      try {
        const data = await api("/sessions");
        if (!data?.sessions?.length) {
          el.innerHTML = `<div class="card"><div class="empty">No active sessions.</div></div>`;
          return;
        }
         el.innerHTML = `<div class="card"><h2>Active browser sessions</h2><p class="desc">Each row is a currently valid dashboard or app session. Revoke a row to invalidate it immediately; users can sign in again to create a new session.</p><table><thead><tr><th>User</th><th>IP</th><th>Expires</th><th></th></tr></thead><tbody>${
          data.sessions.map(s => `<tr><td>${escapeHtml(s.email)}</td><td>${escapeHtml(s.ip || "—")}</td><td>${escapeHtml(s.expires_at)}</td><td><button class="btn" data-revoke="${s.id}">Revoke</button></td></tr>`).join("")
        }</tbody></table></div>`;
        el.querySelectorAll("[data-revoke]").forEach(btn => btn.onclick = async () => {
          await api("/sessions/" + btn.dataset.revoke + "/revoke", { method: "POST" }); loadSessions();
        });
      } catch (err) { el.innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`; }
    }

    async function loadTheme() {
      const el = document.getElementById("panel-theme");
      try {
        const data = await api("/theme");
        el.innerHTML = `<div class="card">
          ${data.free_branding_locked ? `<div class="notice">Free plan keeps <strong>sooauth</strong> on login pages. Upgrade to customize branding.</div>` : ""}
           <h2>Login page look</h2>
           <p class="desc">These settings change the hosted sign-in, sign-up, verification, and reset pages for this project. They do not change the dashboard theme.</p>
          <form id="theme-form" style="max-width:420px">
            <div class="field"><label>Brand name</label><input name="brand_name" value="${escapeHtml(data.brand_name || "sooauth")}" ${!data.can_customize_brand ? "disabled" : ""}></div>
            <div class="field"><label>Logo URL</label><input name="logo_url" value="${escapeHtml(data.logo_url || "")}" ${!data.can_customize_brand ? "disabled" : ""}></div>
            <div class="field"><label>Accent color</label><input name="accent_color" value="${escapeHtml(data.accent_color || "#E8FF3F")}"></div>
            <label style="display:flex;align-items:center;gap:10px;margin:16px 0;font-size:.875rem;color:var(--muted)">
              <input name="hide_branding" type="checkbox" ${data.hide_branding ? "checked" : ""} ${!data.can_hide_branding ? "disabled" : ""} style="width:auto">
              Hide &quot;Powered by sooauth&quot;
            </label>
            <button type="submit" class="btn btn-primary">Save</button>
          </form></div>`;
        document.getElementById("theme-form").onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          await api("/theme", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.fromEntries(fd.entries())) });
        };
      } catch (err) { el.innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`; }
    }

    async function loadBilling() {
      const el = document.getElementById("panel-billing");
      try {
        const data = await api("/billing");
        const fmtPrice = (quote) => {
          if (!quote) return "Free";
          const major = quote.currency === "TRY"
            ? (quote.amount_cents / 100).toLocaleString("tr-TR")
            : (quote.amount_cents / 100).toLocaleString("en-US", { style: "currency", currency: "USD" });
          return `${major} / ${quote.interval}`;
        };
        el.innerHTML = `
          <div class="card">
            <h2>Current plan</h2>
            <p class="desc"><strong>${escapeHtml(data.plan_label)}</strong> · ${data.max_projects} project${data.max_projects === 1 ? "" : "s"} · status ${escapeHtml(data.status)}</p>
            ${data.period_end ? `<p class="desc">Renews on ${escapeHtml(data.period_end)}</p>` : ""}
            ${data.manual_upgrade_enabled ? `<div class="notice">Manual billing is enabled on this server — upgrades apply instantly without payment.</div>` : ""}
          </div>
          <div class="plan-grid">
            ${data.plans.map(plan => {
              const current = plan.id === data.plan;
              const rank = { free: 1, pro: 2, business: 3 };
              const canUpgrade = rank[plan.id] > rank[data.plan];
              const paytr = data.providers.find(p => p.id === "paytr");
              const stripe = data.providers.find(p => p.id === "stripe");
              return `<article class="plan-card ${current ? "current" : ""}">
                <h3>${escapeHtml(plan.label)}${current ? " · current" : ""}</h3>
                <div class="plan-price">${escapeHtml(fmtPrice(plan.price_try || (plan.id === "free" ? null : plan.price_try)))}
                  ${plan.price_try ? `<small>TR</small>` : ""}
                </div>
                ${plan.price_usd ? `<div class="desc">${escapeHtml(fmtPrice(plan.price_usd))} international</div>` : ""}
                <ul class="plan-features">${plan.features.map(f => `<li>${escapeHtml(f)}</li>`).join("")}</ul>
                <div class="plan-actions">
                  ${current ? `<span class="badge">Active</span>` : canUpgrade ? `
                    ${data.manual_upgrade_enabled ? `<button type="button" class="btn btn-primary" data-upgrade="${plan.id}" data-provider="manual">Upgrade now</button>` : ""}
                    ${paytr?.available ? `<button type="button" class="btn" data-upgrade="${plan.id}" data-provider="paytr">Pay with PayTR</button>` : `<button type="button" class="btn" disabled title="Coming soon">PayTR (soon)</button>`}
                    ${stripe?.available ? `<button type="button" class="btn" data-upgrade="${plan.id}" data-provider="stripe">Pay with Stripe</button>` : `<button type="button" class="btn" disabled title="Coming soon">Stripe (soon)</button>`}
                  ` : `<span class="desc">Contact support to downgrade.</span>`}
                </div>
              </article>`;
            }).join("")}
          </div>`;
        el.querySelectorAll("[data-upgrade]").forEach(btn => btn.onclick = async () => {
          btn.disabled = true;
          try {
            const result = await api("/billing/upgrade", {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
              body: JSON.stringify({ plan: btn.dataset.upgrade, provider: btn.dataset.provider }),
            });
            if (result?.status === "completed") {
              showNotice(`Upgraded to ${result.plan_label || btn.dataset.upgrade}.`);
              location.reload();
              return;
            }
            showAlert(result?.message || "Online checkout is not enabled yet.");
          } catch (err) {
            showAlert(err.message);
          } finally {
            btn.disabled = false;
          }
        });
      } catch (err) { el.innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`; }
    }

    async function loadAudit() {
      const el = document.getElementById("panel-audit");
      try {
        const data = await api("/audit");
        if (!data?.entries?.length) {
          el.innerHTML = `<div class="card"><div class="empty">No events yet.</div></div>`;
          return;
        }
        el.innerHTML = `<div class="card"><table><thead><tr><th>Time</th><th>Action</th><th>IP</th></tr></thead><tbody>${
          data.entries.map(e => `<tr><td>${escapeHtml(e.created_at)}</td><td>${escapeHtml(e.action)}</td><td>${escapeHtml(e.ip || "—")}</td></tr>`).join("")
        }</tbody></table></div>`;
      } catch (err) { el.innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`; }
    }

    function setupTheme() {
      const root = document.documentElement;
      const button = document.getElementById("theme-toggle");
      const stored = localStorage.getItem("sooauth-dashboard-theme");
      if (stored === "light" || stored === "dark") root.dataset.theme = stored;
      const update = () => {
        const dark = root.dataset.theme === "dark";
        button.textContent = dark ? "Use light theme" : "Use dark theme";
      };
      update();
      button.onclick = () => {
        const next = root.dataset.theme === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        localStorage.setItem("sooauth-dashboard-theme", next);
        update();
      };
    }

    async function boot() {
      try {
        setupTheme();
        await refreshDashboard();
        showTab(tabFromHash(), false);
      } catch (err) { showAlert(err.message); }
    }
    boot();
  </script>
</body>
</html>
